# Docker DNS must refresh when backend containers are replaced during deployment.
upstream knightly_api {
    zone knightly_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8000 resolve;
}
server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://knightly_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    # The export's scripts and styles are named by their content hash, so a release never
    # reuses a name: browsers and Cloudflare may keep them for a year.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Pages and unhashed files are checked each visit (a quick 304), so a release shows at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
