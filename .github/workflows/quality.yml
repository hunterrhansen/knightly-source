name: Quality
# GitHub Free's private-repo minutes cover main pushes and manual runs; pushes
# are checked locally by the pre-push hook (`npm run hooks:install`).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm run env:check
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-logs
          path: .verification/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm run env:check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runtime
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-smoke-evidence
          path: |
            .verification/runtime-*/*.log
            .verification/runtime-*/*.json
            .verification/runtime-*/report/
            .verification/runtime-*/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  backend:
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    # Postgres 16 to match the runner's own pg_dump (the backup test runs it).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      KNIGHTLY_SCHEMA_OUTPUT: ${{ github.workspace }}/.verification/backend-openapi.json
      KNIGHTLY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # The official Stockfish build, downloaded once and then restored from the Actions cache
      # (about a second, where apt took eleven), and pinned: bump the version in both places.
      - name: Restore Stockfish
        id: stockfish
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/stockfish
          key: stockfish-17.1-ubuntu-x86-64-avx2
      - name: Download Stockfish
        if: steps.stockfish.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/stockfish
          curl -sSfL https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-ubuntu-x86-64-avx2.tar \
            | tar -xO stockfish/stockfish-ubuntu-x86-64-avx2 > ~/stockfish/stockfish
          chmod +x ~/stockfish/stockfish
      - run: echo "$HOME/stockfish" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --python 3.11
        working-directory: backend
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
        working-directory: backend
      - name: Check backend contract against Expo
        working-directory: backend
        run: uv run python -c "import json; from pathlib import Path; assert json.loads(Path('../.verification/backend-openapi.json').read_text()) == json.loads(Path('../contracts/knightly.openapi.json').read_text()), 'Backend OpenAPI differs from the Expo contract'"

  server_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  required:
    name: Required checks
    needs: [fast, browser, backend, server_image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all package and image gates to pass
        env:
          FAST: ${{ needs.fast.result }}
          BROWSER: ${{ needs.browser.result }}
          BACKEND: ${{ needs.backend.result }}
          IMAGE: ${{ needs.server_image.result }}
        run: |
          set -eu
          test "$FAST" = success
          test "$BROWSER" = success
          test "$BACKEND" = success
          test "$IMAGE" = success
